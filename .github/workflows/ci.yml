name: Verify microbox
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: python3 -m unittest discover -s python/tests -v
      - run: cargo doc --workspace --no-deps --locked
  linux-adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --workspace --locked
      - name: Run against real Linux isolation primitives
        run: |
          cg="/sys/fs/cgroup/microbox-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          root="$RUNNER_TEMP/microbox-root"
          sudo mkdir "$cg"
          trap 'sudo rmdir "$cg"' EXIT
          sudo env MICROBOX_CGROUP="$cg" MICROBOX_ROOTFS="$root" bash tests/adversarial/host.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-tests-and-measurements
          path: results/
