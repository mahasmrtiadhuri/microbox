name: Validate packaged microbox
on:
  push:
    paths: [microbox-source.tar.gz, .github/workflows/bootstrap.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: tar -xzf microbox-source.tar.gz
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-workspace
          path: |
            Cargo.lock
            crates/
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked
      - name: Exercise real kernel isolation
        run: |
          cg="/sys/fs/cgroup/microbox-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          root="$RUNNER_TEMP/microbox-root"
          sudo mkdir "$cg"
          trap 'sudo rmdir "$cg"' EXIT
          sudo env MICROBOX_CGROUP="$cg" MICROBOX_ROOTFS="$root" bash tests/adversarial/host.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-tests-and-measurements
          path: results/
