[workspace]
members = ["crates/microbox-sys", "crates/microbox-helper", "crates/microbox", "crates/microbox-cli", "crates/microbox-egress"]
resolver = "2"
[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mahasmrtiadhuri/microbox"
[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
anyhow = "1"
microbox-sys = { path = "crates/microbox-sys" }
microbox = { path = "crates/microbox" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
